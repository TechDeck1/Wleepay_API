name: Deploy Backend (WleePay API)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '5.0.x'

      - name: Restore
        run: dotnet restore wleepay.API/wleepay.API.csproj

      - name: Publish
        run: dotnet publish wleepay.API/wleepay.API.csproj -c Release -o publish

      # appsettings.json / appsettings.Development.json are excluded on purpose:
      # the real production connection string lives ONLY on the server, never in git.
      # This prevents CI from ever overwriting it with a dev/local value.
      # SSH_PRIVATE_KEY secret must contain the base64-encoded private key
      # (generate with: base64 -w0 ~/.ssh/deploy_key_rsa) to avoid paste corruption.
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy build to server
        run: rsync -avzr --delete --exclude=appsettings.json --exclude=appsettings.Development.json -e "ssh -i ~/.ssh/deploy_key" publish/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/wleepay/wleepayApi.arielsoftwares.com/

      - name: Fix ownership and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "chown -R root:root /var/www/wleepay/wleepayApi.arielsoftwares.com/ && systemctl restart wleepay.service && systemctl status wleepay.service --no-pager"
