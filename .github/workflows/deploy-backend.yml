name: Deploy Backend (WleePay API)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '5.0.x'

      - name: Restore
        run: dotnet restore wleepay.API/wleepay.API.csproj

      - name: Publish
        run: dotnet publish wleepay.API/wleepay.API.csproj -c Release -o publish

      # appsettings.json / appsettings.Development.json are excluded on purpose:
      # the real production connection string lives ONLY on the server, never in git.
      # This prevents CI from ever overwriting it with a dev/local value.
      - name: Deploy build to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=appsettings.json --exclude=appsettings.Development.json
          path: publish/
          remote_path: /var/www/wleepay/wleepayApi.arielsoftwares.com/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Fix ownership and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chown -R root:root /var/www/wleepay/wleepayApi.arielsoftwares.com/
            systemctl restart wleepay.service
            systemctl status wleepay.service --no-pager
